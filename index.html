<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container-fluid vh-100 d-flex justify-content-center align-items-center">

<div class="login-card row g-0">

<div class="col-md-6 left-panel">

<h1 class="login-heading">Login</h1>

<p class="small-text">
Don't have an account?
<a href="#">Create your account</a>
</p>

<input type="text" class="form-control custom-input" placeholder="Username">

<input type="password" class="form-control custom-input" placeholder="Password">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>
<input type="checkbox">
Remember Me
</div>

<a href="#" class="forgot-link">
Forgot password?
</a>

</div>

<button class="btn login-btn">
LOGIN
</button>

<div class="social-section">

<p>Or login with</p>

<button class="btn btn-primary me-2">
Facebook
</button>

<button class="btn btn-info text-white">
Twitter
</button>

</div>

</div>

<div class="col-md-6 right-panel">

<img src="images/bg.jpg" class="bg-image" alt="Background">

<div class="welcome-content">

<h1>
Welcome<br>
Back.
</h1>

<p>
Login to access your account and continue your journey.
</p>

</div>

</div>

</div>

</div>

</body>
</html>
